services:
  # ===== DATABASES =====

  postgres-user:
    image: postgres:15-alpine
    container_name: agritrace-user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: agritrace
      POSTGRES_PASSWORD: agritrace2026
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - agritrace-network
    mem_limit: 320m
    mem_reservation: 160m
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U agritrace" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  postgres-product:
    image: postgres:15-alpine
    container_name: agritrace-product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: agritrace
      POSTGRES_PASSWORD: agritrace2026
    ports:
      - "5434:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    networks:
      - agritrace-network
    mem_limit: 320m
    mem_reservation: 160m
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U agritrace" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  postgres-trace:
    image: postgres:15-alpine
    container_name: agritrace-trace-db
    environment:
      POSTGRES_DB: trace_db
      POSTGRES_USER: agritrace
      POSTGRES_PASSWORD: agritrace2026
    ports:
      - "5435:5432"
    volumes:
      - trace-db-data:/var/lib/postgresql/data
    networks:
      - agritrace-network
    mem_limit: 320m
    mem_reservation: 160m
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U agritrace" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  postgres-notification:
    image: postgres:15-alpine
    container_name: agritrace-notification-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: agritrace
      POSTGRES_PASSWORD: agritrace2026
    ports:
      - "5436:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    networks:
      - agritrace-network
    mem_limit: 320m
    mem_reservation: 160m
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U agritrace" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===== CACHE & MESSAGING =====

  redis:
    image: redis:7-alpine
    container_name: agritrace-redis
    ports:
      - "6379:6379"
    networks:
      - agritrace-network
    mem_limit: 320m
    mem_reservation: 160m
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: agritrace-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    networks:
      - agritrace-network
    mem_limit: 320m
    mem_reservation: 160m
    healthcheck:
      test: [ "CMD", "cub", "zk-ready", "localhost:2181", "10" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: agritrace-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "19092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    networks:
      - agritrace-network
    mem_limit: 320m
    mem_reservation: 160m
    healthcheck:
      test: [ "CMD", "cub", "kafka-ready", "-b", "localhost:29092", "1", "20" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===== MICROSERVICES =====

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: agritrace-user-service
    depends_on:
      postgres-user:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/user_db
      SPRING_DATASOURCE_USERNAME: agritrace
      SPRING_DATASOURCE_PASSWORD: agritrace2026
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      GRPC_SERVER_PORT: 9090
      MANAGEMENT_SERVER_PORT: 9081
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      ZIPKIN_URL: http://zipkin:9411
      JWT_SECRET: ${JWT_SECRET:-agritrace-super-secret-key-2026-must-be-at-least-256-bits}
      JAVA_OPTS: -Xms96m -Xmx192m -XX:MaxMetaspaceSize=96m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    ports:
      - "8081:8080"
      - "9091:9090"
      - "9081:9081"
    networks:
      - agritrace-network
    mem_limit: 320m
    mem_reservation: 160m
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: agritrace-product-service
    restart: on-failure # Auto-restart on crash
    depends_on:
      postgres-product:
        condition: service_healthy # Wait for DB to be healthy
      user-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-product:5432/product_db?connectTimeout=30&socketTimeout=30&loginTimeout=30
      SPRING_DATASOURCE_USERNAME: agritrace
      SPRING_DATASOURCE_PASSWORD: agritrace2026
      GRPC_SERVER_PORT: 9090
      MANAGEMENT_SERVER_PORT: 9082
      GRPC_USER_SERVICE: static://user-service:9090
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      ZIPKIN_URL: http://zipkin:9411
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_OPTS: -Xms96m -Xmx192m -XX:MaxMetaspaceSize=96m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    ports:
      - "8082:8080"
      - "9092:9090"
      - "9082:9082"
    networks:
      - agritrace-network
    mem_limit: 320m
    mem_reservation: 160m
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  trace-service:
    build:
      context: .
      dockerfile: trace-service/Dockerfile
    container_name: agritrace-trace-service
    depends_on:
      postgres-trace:
        condition: service_healthy
      product-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-trace:5432/trace_db
      SPRING_DATASOURCE_USERNAME: agritrace
      SPRING_DATASOURCE_PASSWORD: agritrace2026
      GRPC_SERVER_PORT: 9090
      MANAGEMENT_SERVER_PORT: 9083
      GRPC_PRODUCT_SERVICE: static://product-service:9090
      GRPC_USER_SERVICE: static://user-service:9090
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      ZIPKIN_URL: http://zipkin:9411
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_OPTS: -Xms96m -Xmx192m -XX:MaxMetaspaceSize=96m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    ports:
      - "8083:8080"
      - "9093:9090"
      - "9083:9083"
    networks:
      - agritrace-network
    mem_limit: 320m
    mem_reservation: 160m
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9083/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  media-service:
    build:
      context: .
      dockerfile: media-service/Dockerfile
    container_name: agritrace-media-service
    depends_on:
      product-service:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MANAGEMENT_SERVER_PORT: 9084
      GRPC_PRODUCT_SERVICE: static://product-service:9090
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      ZIPKIN_URL: http://zipkin:9411
      JAVA_OPTS: -Xms64m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:+UseG1GC
    ports:
      - "8084:8080"
      - "9084:9084"
    networks:
      - agritrace-network
    mem_limit: 320m
    mem_reservation: 160m
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9084/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  notification-service:
    build:
      context: ..
      dockerfile: agritrace-microservices/notification-service/Dockerfile
    container_name: agritrace-notification-service
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notification:5432/notification_db
      SPRING_DATASOURCE_USERNAME: agritrace
      SPRING_DATASOURCE_PASSWORD: agritrace2026
      MANAGEMENT_SERVER_PORT: 9085
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      ZIPKIN_URL: http://zipkin:9411
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_OPTS: -Xms64m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:+UseG1GC
    ports:
      - "8085:8085"
      - "9085:9085"
    networks:
      - agritrace-network
    mem_limit: 320m
    mem_reservation: 160m
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9085/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: agritrace-api-gateway
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      trace-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MANAGEMENT_SERVER_PORT: 9080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      ZIPKIN_URL: http://zipkin:9411
      JWT_SECRET: ${JWT_SECRET:-agritrace-super-secret-key-2026-must-be-at-least-256-bits}
      JAVA_OPTS: -Xms64m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:+UseG1GC
    ports:
      - "8080:8080"
      - "9080:9080"
    networks:
      - agritrace-network
    mem_limit: 320m
    mem_reservation: 160m
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: agritrace-eureka-server
    environment:
      SERVER_PORT: 8761
      MANAGEMENT_SERVER_PORT: 9761
      ZIPKIN_URL: http://zipkin:9411
      JAVA_OPTS: -Xms64m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:+UseG1GC
    ports:
      - "8761:8761"
    networks:
      - agritrace-network
    mem_limit: 320m
    mem_reservation: 160m
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9761/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  zipkin:
    image: openzipkin/zipkin:3
    container_name: agritrace-zipkin
    environment:
      JAVA_OPTS: -Xms64m -Xmx128m
    ports:
      - "9411:9411"
    networks:
      - agritrace-network
    mem_limit: 320m
    mem_reservation: 160m
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9411/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: agritrace-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - agritrace-network
    mem_limit: 320m
    mem_reservation: 160m
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  grafana:
    image: grafana/grafana:11.1.4
    container_name: agritrace-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - agritrace-network
    mem_limit: 320m
    mem_reservation: 160m
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
networks:
  agritrace-network:
    driver: bridge

volumes:
  user-db-data:
  product-db-data:
  trace-db-data:
  notification-db-data:
  prometheus-data:
  grafana-data:


