# ============================================================
# AgriTrace Nginx Reverse Proxy Configuration
# ============================================================
# Security Headers applied:
#   - X-Frame-Options: DENY  (clickjacking protection)
#   - X-Content-Type-Options: nosniff  (MIME sniffing protection)
#   - Content-Security-Policy (CSP)
#   - Strict-Transport-Security (HSTS) - HTTPS only
#   - Referrer-Policy: strict-origin-when-cross-origin
#
# Architecture: Nginx sits in front of the API Gateway as the
# single entry point. Terminates TLS, handles security headers,
# and proxies to api-gateway:8080.
# ============================================================

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ===== Logging =====
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"request_id":"$request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # ===== Performance =====
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;   # Don't expose Nginx version

    # ===== Gzip Compression =====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml
               application/x-javascript image/svg+xml;

    # ===== Rate Limiting (backup layer, primary is in Spring Gateway) =====
    # limit requests per second per IP at the Nginx level
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # ===== Upstream – API Gateway =====
    upstream api_gateway {
        server api-gateway:8080;
        keepalive 32;
    }

    # ===== HTTP → HTTPS Redirect =====
    server {
        listen 80;
        server_name _;

        # Allow health checks over HTTP (Docker/K8s probes)
        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===== HTTPS Server =====
    server {
        listen 443 ssl http2;
        server_name _;

        # ===== TLS Configuration =====
        # For demo: uses self-signed cert (mounted at /etc/nginx/ssl/)
        # For production: replace with Let's Encrypt or CA-signed cert
        ssl_certificate     /etc/nginx/ssl/agritrace.crt;
        ssl_certificate_key /etc/nginx/ssl/agritrace.key;

        # Modern TLS settings (TLS 1.2+ only)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling (disable for self-signed certs)
        # ssl_stapling on;
        # ssl_stapling_verify on;

        # ===== Security Headers =====
        # These apply to ALL responses through this server block
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Content Security Policy
        # Allows: same-origin API calls, fonts from Google, no inline scripts
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none';" always;

        # Request ID for end-to-end tracing (complements Micrometer traceId)
        add_header X-Request-ID $request_id always;

        # ===== API Proxy =====
        location /api/ {
            # Rate limit at Nginx level (redundant with Spring Gateway, defense-in-depth)
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";           # Keepalive to upstream
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Don't expose upstream error pages
            proxy_intercept_errors on;
        }

        # Stricter rate limit for auth endpoints at Nginx level
        location ~ ^/api/v1/auth/(login|register) {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # ===== Frontend SPA (React/Vite) =====
        # In production, serve the built dist/ folder directly
        # For demo, proxy to the Vite dev server if running
        location / {
            # Option A: Serve static files (uncomment after `npm run build`)
            # root /usr/share/nginx/html;
            # try_files $uri $uri/ /index.html;

            # Option B: Proxy to Vite dev server (demo mode)
            proxy_pass http://host.docker.internal:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # WebSocket support for Vite HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ===== Health Check =====
        location /nginx-health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # ===== Custom Error Pages =====
        error_page 429 /429.json;
        error_page 502 503 504 /50x.json;

        location = /429.json {
            internal;
            default_type application/json;
            return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded. Please slow down.","retryAfter":60}';
        }
        location = /50x.json {
            internal;
            default_type application/json;
            return 502 '{"error":"Service Unavailable","message":"Backend service is temporarily unavailable. Please try again later."}';
        }
    }
}
