---
# ============================================================
# AgriTrace – Secrets
# ============================================================
# IMPORTANT: In production, use:
#   - External Secrets Operator (ESO) with AWS Secrets Manager / Vault
#   - Sealed Secrets (kubeseal)
#   - Never commit real secrets to git!
#
# For demo: base64 encode your secrets:
#   echo -n "your-secret" | base64
#
# Current values are DEMO ONLY placeholders.
# Replace before any real deployment.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: agritrace-secrets
  namespace: agritrace
  labels:
    app.kubernetes.io/name: agritrace
    app.kubernetes.io/component: secrets
  annotations:
    # Reminder: rotate these in production
    secret.agritrace.io/last-rotated: "2026-05-27"
type: Opaque
stringData:
  # JWT Secret – REPLACE with: openssl rand -base64 48 | base64
  JWT_SECRET: "agritrace-demo-jwt-secret-replace-in-production-must-be-at-least-256-bits"

  # Database credentials – REPLACE in production
  POSTGRES_USER: "agritrace"
  POSTGRES_PASSWORD: "agritrace2026-REPLACE-IN-PROD"

  # Grafana admin – REPLACE in production
  GF_SECURITY_ADMIN_PASSWORD: "admin-REPLACE-IN-PROD"

---
# ============================================================
# Database Credentials – per service
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: agritrace-db-user
  namespace: agritrace
type: Opaque
stringData:
  url: "jdbc:postgresql://postgres-user:5432/user_db"
  username: "agritrace"
  password: "agritrace2026-REPLACE-IN-PROD"

---
apiVersion: v1
kind: Secret
metadata:
  name: agritrace-db-product
  namespace: agritrace
type: Opaque
stringData:
  url: "jdbc:postgresql://postgres-product:5432/product_db"
  username: "agritrace"
  password: "agritrace2026-REPLACE-IN-PROD"

---
apiVersion: v1
kind: Secret
metadata:
  name: agritrace-db-trace
  namespace: agritrace
type: Opaque
stringData:
  url: "jdbc:postgresql://postgres-trace:5432/trace_db"
  username: "agritrace"
  password: "agritrace2026-REPLACE-IN-PROD"
