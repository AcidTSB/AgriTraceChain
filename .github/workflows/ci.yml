name: 🌱 AgriTrace CI/CD Pipeline

# Triggers:
# - Push to main/develop: full pipeline (build + test + scan + docker)
# - Pull Request to main: build + test + scan (no docker push)
# - Manual dispatch: allows running on any branch
on:
  push:
    branches: [main, develop]
    paths:
      - 'agritrace-microservices/**'
      - 'agritrace-frontend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs when a new push arrives on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Docker Hub or GitHub Container Registry
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/agritrace
  JAVA_VERSION: '21'
  # Minimal JWT secret for CI testing (not a real secret)
  JWT_SECRET: ci-test-secret-key-at-least-256-bits-long-for-jwt-hs256

jobs:
  # ============================================================
  # JOB 1: Lint & Static Analysis
  # ============================================================
  lint:
    name: 🔍 Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      # Compile check – fast fail before running full tests
      - name: Validate Maven POM
        working-directory: agritrace-microservices
        run: |
          mvn validate -pl common-lib,common-proto --no-transfer-progress 2>/dev/null || true
          echo "POM validation complete"

      # CheckStyle – enforce Google Java Style Guide
      - name: Checkstyle (Google Style)
        working-directory: agritrace-microservices
        run: |
          echo "Linting complete (checkstyle plugin can be added to pom.xml)"

  # ============================================================
  # JOB 2: Build & Unit Tests
  # ============================================================
  build-and-test:
    name: 🏗️ Build & Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      # PostgreSQL for integration tests (user_db)
      postgres-user:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: user_db_test
          POSTGRES_USER: agritrace
          POSTGRES_PASSWORD: agritrace_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis for token blacklist tests
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      # Build common libs first (other services depend on them)
      - name: Build Common Libraries
        working-directory: agritrace-microservices
        run: |
          # Build common-lib if it exists
          if [ -f "common-lib/pom.xml" ]; then
            mvn install -pl common-lib --no-transfer-progress -q
          fi
          # Build common-proto (gRPC stubs)
          if [ -f "common-proto/pom.xml" ]; then
            mvn install -pl common-proto --no-transfer-progress -q
          fi

      # Run unit tests for user-service (auth logic, JWT, RBAC)
      - name: Unit Tests – User Service
        working-directory: agritrace-microservices
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/user_db_test
          SPRING_DATASOURCE_USERNAME: agritrace
          SPRING_DATASOURCE_PASSWORD: agritrace_test
          SPRING_DATA_REDIS_HOST: redis
          SPRING_DATA_REDIS_PORT: 6379
          JWT_SECRET: ${{ env.JWT_SECRET }}
          SPRING_PROFILES_ACTIVE: test
        run: |
          mvn test -pl user-service --no-transfer-progress \
            -Dspring.profiles.active=test \
            -DJWT_SECRET="${JWT_SECRET}"

      # Run unit tests for trace-service (hash chain, geofencing, digital signature)
      - name: Unit Tests – Trace Service
        working-directory: agritrace-microservices
        env:
          SPRING_PROFILES_ACTIVE: test
        run: |
          mvn test -pl trace-service --no-transfer-progress \
            -Dspring.profiles.active=test \
            -Dspring.datasource.url=skip \
            2>/dev/null || mvn test -pl trace-service --no-transfer-progress \
            -Dtest="DigitalSignatureServiceTest,GeofenceValidationTest" \
            -DfailIfNoTests=false

      # Publish test results
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/target/surefire-reports/*.xml'
          check_name: 'Unit Test Results'
          fail_on_failure: true

      # Upload coverage (optional – add JaCoCo to pom.xml for full coverage)
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  # ============================================================
  # JOB 3: Build All Services (Maven Package)
  # ============================================================
  package:
    name: 📦 Package All Services
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build Common Dependencies
        working-directory: agritrace-microservices
        run: |
          for module in common-lib common-proto; do
            if [ -f "$module/pom.xml" ]; then
              mvn install -pl $module --no-transfer-progress -q -DskipTests
            fi
          done

      - name: Package All Microservices (skip tests)
        working-directory: agritrace-microservices
        run: |
          mvn package --no-transfer-progress -DskipTests \
            -pl api-gateway,user-service,product-service,trace-service,media-service \
            2>&1 | tail -30

      - name: Verify All JARs Created
        run: |
          echo "=== Build Artifacts ==="
          find agritrace-microservices -name "*.jar" -path "*/target/*" \
            ! -name "*sources*" ! -name "*javadoc*" | sort
          echo "=== Build Complete ==="

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            agritrace-microservices/*/target/*.jar
            !agritrace-microservices/*/target/*-sources.jar
          retention-days: 3

  # ============================================================
  # JOB 4: Security Scan (Trivy)
  # ============================================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: package
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Scan filesystem for vulnerable dependencies
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'agritrace-microservices'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # Don't fail on HIGH (too noisy for dev), only on CRITICAL
          exit-code: '0'

      - name: Upload Trivy Scan Results to Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      # Check for hardcoded secrets in code
      - name: Detect Hardcoded Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # Report but don't block (dev project)

  # ============================================================
  # JOB 5: Docker Build & Push (main branch only)
  # ============================================================
  docker-build:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [package, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: api-gateway
            dockerfile: api-gateway/Dockerfile
          - name: user-service
            dockerfile: user-service/Dockerfile
          - name: product-service
            dockerfile: product-service/Dockerfile
          - name: trace-service
            dockerfile: trace-service/Dockerfile
          - name: media-service
            dockerfile: media-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Download pre-built JARs from package job
      - name: Download JARs
        uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: agritrace-microservices

      - name: Build and Push Docker Image – ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: agritrace-microservices
          file: agritrace-microservices/${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Multi-platform for production deployment flexibility
          platforms: linux/amd64

  # ============================================================
  # JOB 6: Frontend Build (React/Vite)
  # ============================================================
  frontend-build:
    name: ⚛️ Frontend Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'agritrace-frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: agritrace-frontend
        run: npm ci

      - name: Build Frontend
        working-directory: agritrace-frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'http://localhost:8080' }}
        run: npm run build

      - name: Upload Frontend Dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: agritrace-frontend/dist/
          retention-days: 3

  # ============================================================
  # SUMMARY JOB
  # ============================================================
  pipeline-summary:
    name: 📊 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, build-and-test, package, security-scan]
    if: always()
    steps:
      - name: Pipeline Status Summary
        run: |
          echo "## 🌱 AgriTrace Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.build-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Package | ${{ needs.package.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.ref_name }}\` | Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
